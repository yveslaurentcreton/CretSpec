name: Package installation

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/channels.yml'
      - 'scripts/package.py'
      - 'scripts/prepare-channels.py'
      - 'scripts/test-winget.ps1'
  workflow_dispatch:
    inputs:
      version:
        description: Published release version (empty selects latest)
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          if [ -z "$RELEASE_VERSION" ]; then
            tag=$(gh release view --json tagName --jq .tagName)
            RELEASE_VERSION=${tag#v}
          fi
          python scripts/prepare-channels.py --version "$RELEASE_VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-submission
          path: dist/channels/packages
          include-hidden-files: true

  winget:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog-submission
          path: packages
      - name: Prepare WinGet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PackageProvider -Name NuGet -Force | Out-Null
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -AllUsers
      - run: ./scripts/test-winget.ps1 -Directory packages/winget
        shell: pwsh
